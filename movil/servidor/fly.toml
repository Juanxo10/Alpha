app = "geovisor-merced-jp"
primary_region = "bog"

[build]

[env]
  PORT = "8080"

[mounts]
  source = "datos"
  destination = "/app/clientes/merced/datos"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # las alertas y recordatorios corren en un hilo del servidor
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
